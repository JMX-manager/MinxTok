<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0b" id="metaTheme">
<script>
  // 首屏前先落主题：登录页和聊天页共用一套「日出日落」判断，就不会一深一浅
  (function () {
    var mode = 'auto';
    var geo = { lat: 41.88, lon: 123.92 };
    // 存储可能被系统/隐私模式禁用，读写失败也要继续算主题，不能停在 HTML 默认的深色
    try {
      mode = localStorage.getItem('minxtok.themeMode') || 'auto';
      var g = JSON.parse(localStorage.getItem('minxtok.geo') || 'null');
      if (g && typeof g.lat === 'number' && Date.now() - g.at < 6 * 3600 * 1000) geo = g;
    } catch (e) { /* 忽略存储异常 */ }

    var t = (mode === 'dark' || mode === 'light') ? mode : 'auto';
    if (t === 'auto') {
      try {
        var now = new Date();
        var start = new Date(now.getFullYear(), 0, 0);
        var N = Math.floor((now - start) / 86400000);
        var rad = Math.PI / 180;
        var dec = -23.44 * rad * Math.cos((2 * Math.PI * (N + 10)) / 365);
        var cosH = -Math.tan(geo.lat * rad) * Math.tan(dec);
        var sunrise = 0, sunset = 24;
        if (cosH > -1 && cosH < 1) {
          var H = Math.acos(cosH) / rad;
          var tz = -now.getTimezoneOffset() / 60;
          var noonUTC = 12 - geo.lon / 15;
          sunrise = noonUTC - H / 15 + tz;
          sunset = noonUTC + H / 15 + tz;
        }
        var h = now.getHours() + now.getMinutes() / 60;
        t = (h >= sunrise && h < sunset) ? 'light' : 'dark';
      } catch (e2) {
        t = 'light';
      }
    }

    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0a0a0b' : '#f6f6f7');
  })();
</script>
<script>
  // 数理字体：在样式加载前挂到 html 上，避免首屏闪一下衬线
  (function () {
    try {
      var v = localStorage.getItem('minxtok.mathfont') === 'sans' ? 'sans' : 'serif';
      document.documentElement.setAttribute('data-mathfont', v);
    } catch (e) {
      document.documentElement.setAttribute('data-mathfont', 'serif');
    }
  })();
</script>
<script>
  // 安卓微信：键盘、相册、拍摄会改 visualViewport 高度，重排时整页会“形变”。
  // 用像素高度承接可视区；打开文件选择器期间冻结高度，回来再同步。
  (function () {
    var root = document.documentElement;
    var vv = window.visualViewport;
    var stable = (vv && vv.height) || window.innerHeight || root.clientHeight || 0;
    var holdUntil = 0;
    var timer = 0;
    function apply(h) {
      if (!h || h < 120) return;
      root.style.setProperty('--app-height', Math.round(h) + 'px');
    }
    function current() { return vv ? vv.height : window.innerHeight; }
    function sync() {
      if (Date.now() < holdUntil) return;
      var h = current();
      if (!h) return;
      if (h < stable * 0.3) return; // 键盘/相册切换瞬间的异常值，不当真
      if (h > stable && !vv) stable = window.innerHeight || h;
      apply(h);
    }
    // 跟手（明轩 2026-10-29 第三次）：不再攒防抖、也不再补过渡，可视视口每变一帧就跟一帧。
    // 之前「延时 24ms + 高度 220ms 过渡」是两段延迟叠一起，键盘已经到顶了页面还在往上爬。
    var raf = 0;
    function schedule() {
      if (raf) return;
      raf = requestAnimationFrame(function () { raf = 0; sync(); });
    }
    window.__minxHoldViewport = function () { holdUntil = Date.now() + 15000; };
    apply(stable);
    window.addEventListener('resize', schedule, { passive: true });
    if (vv) vv.addEventListener('resize', schedule, { passive: true });
    document.addEventListener('focusin', function () { setTimeout(schedule, 260); }, true);
    document.addEventListener('focusout', function () { setTimeout(schedule, 260); }, true);
    document.addEventListener('change', function (e) {
      if (e.target && e.target.type === 'file') {
        holdUntil = 0;
        setTimeout(sync, 120);
      }
    }, true);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        holdUntil = 0;
        setTimeout(sync, 120);
      }
    });
    window.addEventListener('pageshow', function () { holdUntil = 0; schedule(); });
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.tagName === 'INPUT' && t.type === 'file') holdUntil = Date.now() + 15000;
    }, true);
    window.addEventListener('focus', function () {
      setTimeout(function () { holdUntil = 0; sync(); }, 450);
    });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        stable = window.innerHeight || stable;
        holdUntil = 0;
        apply(stable);
      }, 350);
    });
  })();
</script>

<body class="loading">

    // 兜底：任何脚本错误都不该让人卡在加载页。
    // 主模块 6 秒内没把 loading 去掉，就自己收场并给一句提示。
    setTimeout(function () {
      if (!document.body.classList.contains('loading')) return;
      document.body.classList.remove('loading');
      var line = document.createElement('div');
      line.style.cssText = 'position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:13px;opacity:.55;color:var(--fg);z-index:99999';
      line.textContent = '加载有点慢，下拉刷新试试';
      document.body.appendChild(line);
    }, 6000);
  </script>

<script>
  // 所有 /api 请求自动带上会话 token，后端据此校验 uid，避免前端 uid 被随意伪造
  (function () {
    var raw = window.fetch.bind(window);
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      if (url.indexOf('/api/') !== -1) {
        var token = '';
        try { token = localStorage.getItem('minxtok.token') || ''; } catch (_) {}
        if (token) {
          init = init || {};
          var h = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
          if (!h.has('Authorization')) h.set('Authorization', 'Bearer ' + token);
          init.headers = h;
        }
      }
      return raw(input, init);
    };
  })();
</script>
<script>
  // 启动看门狗：模块图一旦挂掉（import 缺失、语法错），页面会永远停在启动页且按钮全死。
  // 15 秒还没进正文才提示，避免大字体/慢网络把脚本模块挤到超时。
  (function () {
    window.__minxBooted = false;
    setTimeout(function () {
      if (window.__minxBooted) return;
      document.body.classList.remove('loading', 'auth-pending');
      var sp = document.getElementById('splash');
      if (sp) sp.remove();
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;padding:12px 14px;border-radius:14px;background:#2a1414;color:#ffb4b4;font-size:calc(var(--fs-md) * 0.8);line-height:1.6;font-family:-apple-system,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)';
      box.textContent = '脚本没加载起来：' + (window.__minxBootError || '未知原因') + '（下拉刷新重试）';
      document.body.appendChild(box);
    }, 15000);
    window.addEventListener('error', function (e) {
      if (e && e.message && !window.__minxBootError) window.__minxBootError = e.message;
    }, true);
  })();
</script>
