<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>明叙访客门户 · 通道路由</title>
<meta name="description" content="明叙访客门户的固定入口，从这里一键进入当前最新可用的访问地址。">
<style>
  :root{
    --bg:#eef1f6; --text:#1f2937; --muted:#6b7280; --main:#4f7cff; --grad:linear-gradient(135deg,#4f7cff,#7a5cff);
    --card:rgba(255,255,255,.82); --line:#e5e9f0; --ok:#22c55e; --bad:#ef4444;
    --shadow:0 12px 40px rgba(20,30,60,.10);
  }
  html[data-theme="dark"]{
    --bg:#12151c; --text:#e6e9ef; --muted:#8b93a3; --main:#6b96ff; --grad:linear-gradient(135deg,#5b86ff,#8a6bff);
    --card:rgba(27,32,41,.82); --line:#2a303c; --ok:#34d399; --bad:#f87171;
    --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; padding:0 16px 48px;
    -webkit-font-smoothing:antialiased;
  }
  /* 顶部品牌条 */
  .top{
    width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between;
    padding:18px 4px 14px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{font-size:21px; font-weight:800; letter-spacing:.4px; background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .zh{font-size:13px; color:var(--muted); font-weight:600;}
  .badge{font-size:11px; font-weight:600; color:#fff; background:var(--grad); padding:4px 9px; border-radius:20px;}

  .wrap{width:100%; max-width:560px;}

  /* 主卡片 */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
    margin-bottom:16px;
  }
  .card h1{font-size:19px; margin:0 0 4px; font-weight:700;}
  .card .sub{font-size:13px; color:var(--muted); margin:0 0 18px; line-height:1.5;}

  /* 地址展示 */
  .urlbox{
    display:flex; align-items:center; gap:8px; width:100%;
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:12px 12px; margin:0 0 14px;
  }
  .urlbox .dot{flex:none; width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(34,197,94,.2);}
  .urlbox .url{flex:1; font-size:13px; font-weight:600; word-break:break-all; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .urlbox .st{flex:none; font-size:11px; color:var(--muted);}

  .btn{
    display:block; width:100%; text-align:center; text-decoration:none; color:#fff;
    background:var(--grad); border:none; border-radius:13px; padding:15px 0; font-size:16px; font-weight:700;
    cursor:pointer; letter-spacing:.5px; box-shadow:0 8px 24px rgba(79,124,255,.30);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.98);}

  .actions{display:flex; gap:10px; margin-top:12px;}
  .actions .btn{flex:1; font-size:14px; padding:12px 0;}

  /* 通知条 */
  .notice{
    display:none; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:var(--ok);
    font-size:12.5px; border-radius:10px; padding:10px 12px; margin:0 0 12px; line-height:1.5;
  }
  .notice.show{display:block; animation:in .3s ease;}
  @keyframes in{from{opacity:0; transform:translateY(-6px);} to{opacity:1;}}

  /* 说明小字 */
  .tips{font-size:12px; color:var(--muted); line-height:1.7; margin:18px 2px 0;}
  .tips b{color:var(--text); font-weight:600;}

  .foot{width:100%; max-width:560px; margin-top:auto; padding-top:18px; font-size:11px; color:var(--muted); text-align:center;}
</style>
</head>
<body>

  <div class="top">
    <div class="brand">
      <span class="logo">𝗠𝗶𝗻𝘅𝗧𝗼𝗸</span><span class="zh">明叙</span>
    </div>
    <span class="badge">访客门户 · 通道路由</span>
  </div>

  <div class="wrap">
    <div class="notice" id="notice"></div>

    <div class="card">
      <h1>进入访客门户</h1>
      <p class="sub">这是明叙访客门户的固定入口。下方显示的是当前时刻可用的访问地址，点击即可进入。</p>

      <div class="urlbox">
        <span class="dot"></span>
        <span class="url" id="url"></span>
        <span class="st" id="st">在线</span>
      </div>

      <a class="btn" id="go" href="#" target="_blank" rel="noopener">进入访客门户 →</a>

      <div class="actions">
        <button class="btn" id="copy">复制地址</button>
        <button class="btn" id="admin" style="display:none">管理后台</button>
      </div>
    </div>

    <div class="tips">
      <b>使用说明：</b>通道路由页的地址会随服务端的公网隧道实时更新。若点击后打不开，可稍等片刻后刷新本页，或联系明轩获取最新地址。<br>
      <b>隐私声明：</b>本页仅展示访问入口，不含任何登录信息或密钥。
    </div>
  </div>

  <div class="foot">MinxTok · 明叙访客门户通道路由</div>

<script src="config.js"></script>
<script>
(function(){
  var url = (window.LATEST_URL || "").trim();
  var admin = (window.ADMIN_URL || "").trim();
  var a = document.getElementById('go');
  var u = document.getElementById('url');
  var adminBtn = document.getElementById('admin');

  if(url){
    u.textContent = url;
    a.href = url;
  }else{
    u.textContent = "（暂未配置访问地址）";
    u.style.color = "var(--bad)";
  }

  if(admin){
    adminBtn.href = admin;
    adminBtn.style.display = "block";
    // 主入口也直接指向管理后台（管理端新页面）
    a.href = admin;
    a.textContent = "进入管理后台 →";
  }

  document.getElementById('copy').addEventListener('click', function(){
    var t = url;
    function done(){ showNotice('已复制到剪贴板 ✓'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done, function(){ fallback(t, done); });
    } else { fallback(t, done); }
  });

  adminBtn.addEventListener('click', function(){
    if(admin) window.open(admin, '_blank');
  });

  function fallback(text, cb){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); cb(); }catch(e){ showNotice('复制失败，请手动长按复制'); }
    document.body.removeChild(ta);
  }

  function showNotice(msg){
    var n = document.getElementById('notice');
    n.textContent = msg; n.classList.add('show');
    clearTimeout(showNotice._t);
    showNotice._t = setTimeout(function(){ n.classList.remove('show'); }, 2000);
  }
})();
</script>
</body>
</html>
