<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MinxTok · 通道路由</title>
<meta name="description" content="从固定入口进入明叙访客门户，一键建立通道。">
<link rel="preload" href="fonts/PingFangSite-Regular.woff2?v=1" as="font" type="font/woff2" crossorigin>
<style>
@font-face{
  font-family:"PingFangMXT";
  src:url("fonts/PingFangSite-Regular.woff2?v=1") format("woff2");
  font-weight:100 900; font-style:normal; font-display:swap;
}
/* ============================================================
   MinxTok · 明叙  —  通道路由  「墨黑 + 冷银」A 套
   与访客端共用同一套变量与秩序
   ============================================================ */
:root{
  --font:"PingFangMXT","PingFang SC",-apple-system,BlinkMacSystemFont,"Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;

  /* A 套 · 墨黑 + 冷银（深色为默认基调） */
  --bg:#000000;
  --bg-soft:#0a0b0d;
  --surface:#0f1114;
  --surface2:#15181d;
  --line:#1e2228;
  --line-soft:#15181c;
  --text:#f2f4f7;
  --text-2:#9ba3ae;
  --text-3:#5f6772;
  --accent:#c8d4e4;
  --accent-2:#8fa3bd;
  --focus:rgba(200,212,228,.18);
  --ok:#7fd1a6; --warn:#e0c07a; --bad:#e08a8a;

  --card:#0c0e11;
  --field:#0a0c0f;
  --fieldline:#1e2228;
  --grad:linear-gradient(135deg,#dfe7f0,#9fb2c8);
  --btntxt:#08090b;
  --glass:rgba(6,7,9,.72);
  --glassM:rgba(12,14,17,.86);
  --radius:14px;
}

/* 浅色：纸感冷灰，同一套秩序 */
html[data-theme="light"]{
  --bg:#fbfbfc;
  --bg-soft:#f4f5f7;
  --surface:#ffffff;
  --surface2:#f7f8fa;
  --line:#e8eaee;
  --line-soft:#f0f1f4;
  --text:#0d0f12;
  --text-2:#5f6772;
  --text-3:#9ba3ae;
  --accent:#1b2430;
  --accent-2:#4a5766;
  --focus:rgba(27,36,48,.10);
  --ok:#1f9d63; --warn:#b0812a; --bad:#c05050;

  --card:#ffffff;
  --field:#f7f8fa;
  --fieldline:#e8eaee;
  --grad:linear-gradient(135deg,#1b2430,#3a4657);
  --btntxt:#ffffff;
  --glass:rgba(251,251,252,.76);
  --glassM:rgba(255,255,255,.9);
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:var(--font);
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 22px 40px;
  -webkit-font-smoothing:antialiased;
  transition:background .3s cubic-bezier(.4,0,.2,1), color .3s cubic-bezier(.4,0,.2,1);
}
/* 绒毛褶皱底纹：与访客端同款氛围层 */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(205deg, rgba(255,255,255,.014) 0 1px, transparent 1px 4px);
  opacity:.85; mix-blend-mode:overlay;
}
html[data-theme="light"] body::before{
  background-image:
    repeating-linear-gradient(115deg, rgba(0,0,0,.016) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(205deg, rgba(0,0,0,.010) 0 1px, transparent 1px 4px);
}
body>*{position:relative; z-index:1;}

.wrap{
  width:100%; max-width:420px;
  display:flex; flex-direction:column; align-items:center;
  text-align:center;
  padding-top:8vh;
}

/* ---------- 品牌 ---------- */
.logo{
  font-size:22px; font-weight:600; letter-spacing:.06em;
  color:var(--text);
  animation:up .7s cubic-bezier(.2,.9,.3,1.02) both;
}
.sub{
  margin-top:10px; font-size:12px; color:var(--text-3); letter-spacing:.24em;
  animation:up .7s .06s cubic-bezier(.2,.9,.3,1.02) both;
}
@keyframes up{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

/* ---------- 通道状态 ---------- */
.channel{
  margin-top:38px; width:100%;
  animation:up .7s .12s cubic-bezier(.2,.9,.3,1.02) both;
}
.ch-kind{font-size:11px; color:var(--text-3); letter-spacing:.2em; margin-bottom:10px;}
.ch-url{
  font-size:13px; color:var(--text-2); word-break:break-all; line-height:1.6;
  font-family:var(--font); letter-spacing:.02em;
  padding:0 4px; min-height:20px;
}

/* ---------- 进入按钮 ---------- */
.enter{
  margin-top:30px; width:100%;
  position:relative; overflow:hidden;
  border:none; cursor:pointer; border-radius:12px;
  padding:15px 0; font-family:inherit;
  font-size:15px; font-weight:600; letter-spacing:.06em;
  background:var(--grad); color:var(--btntxt);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.06), opacity .2s;
  animation:up .7s .18s cubic-bezier(.2,.9,.3,1.02) both;
}
.enter:hover{opacity:.92;}
.enter:active{transform:scale(.984);}
.enter[disabled]{cursor:default; opacity:.75;}
.enter .sheen{
  position:absolute; top:0; bottom:0; width:38%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  transform:translateX(-140%); pointer-events:none;
}
.enter.busy .sheen{animation:sweep .95s cubic-bezier(.4,0,.2,1) infinite;}
@keyframes sweep{to{transform:translateX(360%);}}
.enter .lbl{position:relative; z-index:1;}

/* 隐藏的跳转链接（由按钮触发） */
#go{display:none;}

/* ---------- 底部说明（一行小字） ---------- */
.foot{
  margin-top:30px; width:100%;
  display:flex; align-items:center; justify-content:center; gap:14px;
  animation:up .7s .24s cubic-bezier(.2,.9,.3,1.02) both;
}
.foot .meta{font-size:11px; color:var(--text-3); letter-spacing:.08em;}
.foot .dotsep{width:3px; height:3px; border-radius:50%; background:var(--text-3); opacity:.6;}
.tglink{
  background:none; border:none; padding:0; cursor:pointer; font-family:inherit;
  font-size:11px; color:var(--text-3); letter-spacing:.08em;
  border-bottom:1px solid transparent; transition:color .2s, border-color .2s;
}
.tglink:hover{color:var(--text-2); border-bottom-color:currentColor;}

/* ---------- 管理后台入口 ---------- */
.adm{
  margin-top:20px; font-size:11.5px; color:var(--text-3); letter-spacing:.14em;
  cursor:pointer; padding:6px 2px;
  border-bottom:1px solid transparent; transition:color .2s, border-color .2s;
  animation:up .7s .27s cubic-bezier(.2,.9,.3,1.02) both;
}
.adm:hover{color:var(--text-2); border-bottom-color:currentColor;}

/* ---------- 管理后台登录弹层 ---------- */
#adm{
  position:fixed; inset:0; z-index:120;
  background:var(--bg);
  display:none; align-items:center; justify-content:center;
  padding:0 26px;
}
#adm.on{display:flex; animation:fadeIn .3s cubic-bezier(.4,0,.2,1) both;}
.adm-box{width:100%; max-width:340px; text-align:center;}
.adm-title{font-size:17px; font-weight:600; letter-spacing:.1em; color:var(--text);}
.adm-sub{margin-top:8px; font-size:10.5px; color:var(--text-3); letter-spacing:.3em; text-transform:uppercase;}
.adm-in{
  margin-top:30px; width:100%; padding:13px 12px;
  background:var(--field); color:var(--text);
  border:1px solid var(--fieldline); border-radius:10px;
  font-family:inherit; font-size:14px; letter-spacing:.1em; text-align:center;
  outline:none; transition:border-color .2s, box-shadow .2s;
}
.adm-in:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--focus);}
.adm-msg{min-height:16px; margin-top:12px; font-size:11.5px; color:var(--bad); letter-spacing:.06em;}
.adm-go{
  margin-top:6px; width:100%; position:relative; overflow:hidden;
  border:none; cursor:pointer; border-radius:11px; padding:14px 0;
  font-family:inherit; font-size:14.5px; font-weight:600; letter-spacing:.08em;
  background:var(--grad); color:var(--btntxt);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.06), opacity .2s;
}
.adm-go:hover{opacity:.92;}
.adm-go:active{transform:scale(.984);}
.adm-go[disabled]{cursor:default; opacity:.7;}
.adm-go .sheen{
  position:absolute; top:0; bottom:0; width:38%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  transform:translateX(-140%); pointer-events:none;
}
.adm-go.busy .sheen{animation:sweep .95s cubic-bezier(.4,0,.2,1) infinite;}
.adm-go .lbl{position:relative; z-index:1;}
.adm-back{
  margin-top:22px; font-size:11.5px; color:var(--text-3); letter-spacing:.14em;
  cursor:pointer; display:inline-block;
  border-bottom:1px solid transparent; transition:color .2s, border-color .2s;
}
.adm-back:hover{color:var(--text-2); border-bottom-color:currentColor;}
.adm-box.shake{animation:admshake .42s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes admshake{10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(3px);} 30%,50%,70%{transform:translateX(-5px);} 40%,60%{transform:translateX(5px);}}

/* ---------- 建立连接遮罩（神秘感） ---------- */
#link{
  position:fixed; inset:0; z-index:100;
  background:var(--bg);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:0 40px; text-align:center;
}
#link.on{display:flex; animation:fadeIn .35s cubic-bezier(.4,0,.2,1) both;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
#link .ring{
  width:46px; height:46px; border-radius:50%;
  border:1px solid var(--line); border-top-color:var(--text);
  animation:spin 1.05s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
#link .word{
  margin-top:22px; font-size:13px; color:var(--text-2); letter-spacing:.16em;
  min-height:20px;
}
#link .prog{
  margin-top:16px; width:120px; height:1px; background:var(--line); overflow:hidden;
}
#link .prog i{display:block; height:100%; width:0; background:var(--text); transition:width .5s cubic-bezier(.4,0,.2,1);}
</style>
</head>
<body>

  <div class="wrap">
    <div class="logo">𝗠𝗶𝗻𝘅𝗧𝗼𝗸</div>
    <div class="sub">明叙 · 通道路由</div>

    <div class="channel">
      <div class="ch-kind">当前通道</div>
      <div class="ch-url" id="ch-url">正在获取…</div>
    </div>

    <button class="enter" id="enter">
      <span class="sheen"></span>
      <span class="lbl">进入通道</span>
    </button>

    <div class="adm" id="adm-open">管理后台</div>

    <div class="foot">
      <span class="meta" id="foot-meta">在线</span>
      <span class="dotsep"></span>
      <button class="tglink" id="tglink">深浅色</button>
    </div>
  </div>

  <a id="go" href="#"></a>

  <!-- 建立连接遮罩 -->
  <div id="link">
    <div class="ring"></div>
    <div class="word" id="link-word"></div>
    <div class="prog"><i id="link-prog"></i></div>
  </div>

  <!-- 管理后台：登录（失败不暴露后台地址） -->
  <div id="adm">
    <div class="adm-box">
      <div class="adm-title">管理后台</div>
      <div class="adm-sub">Administrator Access</div>
      <input class="adm-in" id="adm-key" type="password" placeholder="访问密钥" autocomplete="off" spellcheck="false">
      <div class="adm-msg" id="adm-msg"></div>
      <button class="adm-go" id="adm-go"><span class="lbl">验证并进入</span></button>
      <div class="adm-back" id="adm-back">返回</div>
    </div>
  </div>

<script src="config.js"></script>
<script>
(function(){
  /* ---------- 深浅色：跟随系统 + 手动切换（localStorage 记忆） ---------- */
  var THEME_KEY='mxtNavTheme';
  function sysDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function pref(){ try{ return localStorage.getItem(THEME_KEY)||'auto'; }catch(e){ return 'auto'; } }
  function isDark(){ var p=pref(); return p==='auto'? sysDark() : p==='dark'; }
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', isDark()?'dark':'light');
  }
  applyTheme();
  if(window.matchMedia){
    try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(pref()==='auto') applyTheme(); }); }catch(e){}
  }
  document.getElementById('tglink').addEventListener('click', function(){
    try{ localStorage.setItem(THEME_KEY, isDark()?'light':'dark'); }catch(e){}
    applyTheme();
  });

  /* ---------- 通道地址 ---------- */
  var url = (window.LATEST_URL || "").trim();
  var uEl = document.getElementById('ch-url');
  var go  = document.getElementById('go');

  if(url){
    uEl.textContent = url;
    go.href = url;
  }else{
    uEl.textContent = "暂未配置通道地址";
    uEl.style.color = "var(--bad)";
    document.getElementById('foot-meta').textContent = "离线";
  }

  /* ---------- 管理后台登录 ---------- */
  var admOpen = document.getElementById('adm-open');
  var adm     = document.getElementById('adm');
  var admKey  = document.getElementById('adm-key');
  var admMsg  = document.getElementById('adm-msg');
  var admGo   = document.getElementById('adm-go');
  var admBack = document.getElementById('adm-back');
  var admBox  = adm.querySelector('.adm-box');

  var ACCESS_KEY = '11w05a909220mpx';   // 与后台密码一保持一致
  var FAILS = ['信号不在覆盖范围', '通道未授权', '无法锁定该节点'];

  function openAdm(){ adm.classList.add('on'); admMsg.textContent=''; admKey.value=''; setTimeout(function(){ try{admKey.focus();}catch(e){} }, 240); }
  function closeAdm(){ adm.classList.remove('on'); }

  admOpen.addEventListener('click', openAdm);
  admBack.addEventListener('click', closeAdm);
  adm.addEventListener('click', function(e){ if(e.target===adm) closeAdm(); });
  admKey.addEventListener('keydown', function(e){ if(e.key==='Enter') admGo.click(); });

  admGo.addEventListener('click', function(){
    if(admGo.disabled) return;
    var v = admKey.value.trim();
    if(!v){
      admMsg.textContent = FAILS[Math.floor(Math.random()*FAILS.length)];
      admBox.classList.remove('shake'); void admBox.offsetWidth; admBox.classList.add('shake');
      return;
    }
    admGo.disabled = true;
    admGo.classList.add('busy');
    admMsg.style.color = 'var(--text-3)';
    admMsg.textContent = '正在核实凭据…';
    if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(e){} }

    setTimeout(function(){
      if(v === ACCESS_KEY){
        admMsg.style.color = 'var(--text-2)';
        admMsg.textContent = '身份已确认 · 正在进入';
        var target = (window.ADMIN_URL||'').trim();
        setTimeout(function(){
          if(target){ window.location.href = target; }
          else{
            admMsg.style.color = 'var(--bad)';
            admMsg.textContent = FAILS[Math.floor(Math.random()*FAILS.length)];
            admGo.disabled=false; admGo.classList.remove('busy');
          }
        }, 520);
      }else{
        admMsg.style.color = 'var(--bad)';
        admMsg.textContent = FAILS[Math.floor(Math.random()*FAILS.length)];
        admBox.classList.remove('shake'); void admBox.offsetWidth; admBox.classList.add('shake');
        if(navigator.vibrate){ try{ navigator.vibrate(14); }catch(e){} }
        admGo.disabled=false; admGo.classList.remove('busy');
      }
    }, 760);
  });

  /* ---------- 建立连接：先蓄势，再跳转 ---------- */
  var btn = document.getElementById('enter');
  var lblEl = btn.querySelector('.lbl');
  var link = document.getElementById('link');
  var word = document.getElementById('link-word');
  var prog = document.getElementById('link-prog');

  var STEPS = ['正在建立通道…', '验证路由…', '握手中…', '准备进入…'];

  btn.addEventListener('click', function(){
    if(!url || btn.disabled) return;
    btn.disabled = true;
    btn.classList.add('busy');
    lblEl.textContent = '建立中';
    if(navigator.vibrate) { try{ navigator.vibrate(10); }catch(e){} }

    link.classList.add('on');
    var i = 0;
    word.textContent = STEPS[0];
    prog.style.width = '22%';

    var t = setInterval(function(){
      i++;
      if(i < STEPS.length){
        word.textContent = STEPS[i];
        prog.style.width = (22 + i*24) + '%';
      }else{
        clearInterval(t);
        prog.style.width = '100%';
        word.textContent = '通道就绪';
        setTimeout(function(){ window.location.href = url; }, 420);
      }
    }, 620);
  });
})();
</script>
</body>
</html>
